<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Tools">
<meta name="theme-color" content="#0A0D16">
<link rel="manifest" href="manifest.json">
<title>Study Tools</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
.tiles{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.tile{
  display:flex;gap:15px;align-items:center;padding:16px;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);
  position:relative;overflow:hidden;
}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tile-accent,var(--accent))}
.tile:active{background:var(--panel2)}
.glyph{
  font-family:var(--display);font-size:34px;font-weight:600;line-height:1;
  color:var(--tile-accent,var(--accent));min-width:56px;text-align:center;
}
.glyph small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);margin-top:5px}
.tinfo{flex:1;min-width:0}
.tinfo b{font-family:var(--display);font-size:24px;font-weight:600;display:block;line-height:1.05}
.tinfo p{margin:3px 0 0;font-size:12.5px;color:var(--dim);line-height:1.35}
.tstats{display:flex;gap:12px;margin-top:8px}
.tstats span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim)}
.tstats b{color:var(--paper);font-weight:600}
.soon{opacity:.42;pointer-events:none}
.empty{
  border:1px dashed var(--edge);border-radius:var(--r);padding:22px;text-align:center;
  color:var(--dim);font-size:13px;line-height:1.5;margin-top:10px;
}
footer{margin-top:auto;padding-top:26px}
.reset{text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <span class="eyebrow">Study tools</span>
  <h1>The <span class="hl">shelf</span></h1>
  <p class="sub">Drills that keep score. Everything you earn feeds one level.</p>

  <div class="level">
    <div class="lv">1<small>LEVEL</small></div>
    <div class="meter"><i></i></div>
  </div>
  <div class="xpnote"></div>

  <div class="tiles" id="tiles"></div>

  <footer>
    <button class="btn quiet reset" id="btnReset">Reset all progress</button>
  </footer>
</div>

<script src="shared/store.js"></script>
<script>
(function(){
  var host = document.getElementById("tiles");

  function tile(a){
    var scope = Store.app(a.id);
    var earned = scope.earned().length;
    var best = scope.bestScore();
    var node = document.createElement(a.live ? "a" : "div");
    node.className = "tile" + (a.live ? "" : " soon");
    if (a.live) node.href = a.path;
    node.style.setProperty("--tile-accent", a.accent);
    node.innerHTML =
      '<div class="glyph">' + a.glyph + '<small>' + (a.live ? "OPEN" : "SOON") + '</small></div>' +
      '<div class="tinfo">' +
        '<b>' + a.name + '</b>' +
        '<p>' + a.tagline + '</p>' +
        '<div class="tstats">' +
          '<span>BEST <b>' + best + '</b></span>' +
          '<span>BADGES <b>' + earned + '/' + a.badges + '</b></span>' +
        '</div>' +
      '</div>';
    return node;
  }

  fetch("apps.json", {cache:"no-cache"})
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data.apps || !data.apps.length){
        host.innerHTML = '<div class="empty">No drills yet. Add one to apps.json and it shows up here.</div>';
        return;
      }
      data.apps.forEach(function(a){ host.appendChild(tile(a)); });
    })
    .catch(function(){
      host.innerHTML = '<div class="empty">Could not load the app list. Reload the page.</div>';
    });

  Store.paintLevel(document);

  document.getElementById("btnReset").onclick = function(){
    if (confirm("Clear every score, badge, and level on this browser?")){
      Store.reset();
      location.reload();
    }
  };
})();
</script>
</body>
</html>
